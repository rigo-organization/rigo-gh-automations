name: Publish GitHub Release

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: 'Prefix required on tags, e.g. v'
        required: false
        default: 'v'
        type: string
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release for existing tag
        uses: actions/github-script@v7
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: |
            if (context.eventName !== 'push' || !context.ref.startsWith('refs/tags/')) {
              core.setFailed('Call this workflow from a tag push event.');
              return;
            }
            const tag = context.ref.slice('refs/tags/'.length);
            const tagPrefix = process.env.TAG_PREFIX;
            if (!tag.startsWith(tagPrefix)) {
              core.setFailed(`Tag '${tag}' must start with '${tagPrefix}'.`);
              return;
            }
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists. Skipping.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: tag,
                generate_release_notes: true,
                prerelease: process.env.IS_PRERELEASE === 'true'
              });
              core.info(`Published release ${tag}.`);
            }
