name: PR Validation

on:
  workflow_call:
    inputs:
      prefix:
        description: 'Repository issue prefix, e.g. DPC-BE'
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: actions/github-script@v7
        env:
          ISSUE_PREFIX: ${{ inputs.prefix }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('This workflow must be called from a pull_request event.');
              return;
            }
            const prefix = process.env.ISSUE_PREFIX;
            if (!/^[A-Z][A-Z0-9-]{1,19}$/.test(prefix)) {
              core.setFailed('Invalid prefix.');
              return;
            }
            const titlePattern = new RegExp(`^\\[${prefix}-\\d+\\]\\s+\\S`);
            if (!titlePattern.test(pr.title || '')) {
              core.setFailed(`PR title must begin with [${prefix}-123] followed by a description.`);
              return;
            }
            core.info('PR title validation passed.');
